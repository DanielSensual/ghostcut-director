name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install -e ".[director]"
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: director demo --out-dir /tmp/director-demo-check
